[project]
name = "fast-juku-backend"
version = "0.2.0"
description = ""
authors = [{ name = "Yota Hashizume" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "openpyxl>=3.1.2,<4",
    "fastapi>=0.103.2,<0.104",
    "pydantic>=2.4.2,<3",
    "mypy>=1.6.1,<2",
    "msoffcrypto-tool>=5.1.1,<6",
    "mangum==0.11.0",
    "sqlalchemy>=2.0.22,<3",
    "pymysql>=1.1.0,<2",
    "boto3>=1.29.5,<2",
    "pynamodb>=5.5.0,<6",
    "pytest>=7.4.3,<8",
    "pytest-mock>=3.12.0,<4",
    "mocker>=1.1.1,<2",
    "moto>=4.2.9,<5",
    "rich>=13.7.0,<14",
    "pandas>=2.1.3,<3",
    "python-multipart>=0.0.6,<0.0.7",
    "starlette==0.27.0",
    "chardet>=5.2.0,<6",
    "python-dotenv>=1.0.0,<2",
    "pytest-asyncio>=0.23.6,<0.24",
    "httpx>=0.27.0,<0.28",
    "pytest-cov>=5.0.0,<6",
    "pytest-snapshot>=0.9.0,<0.10",
    "types-pyyaml>=6.0.12.20240311,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fast_juku_backend"]     

[tool.pytest.ini_options]
pythonpath = "api"
testpaths = ["tests/",]

[tool.mypy]
ignore_missing_imports = true
